function art(w){let src=imageFor(w);return src?`<img class="art" src="${src}" alt="Illustration till ${safe(w.sv)}" onerror="this.onerror=null;this.style.display='none';this.insertAdjacentHTML('afterend','<span>Bild saknas</span>')">`:`<div class="placeholder">${safe(w.sv)}<small style="display:block">Illustration kommer senare</small></div>`}function progress(){let n=words().filter(w=>saved.seen[current+'-'+key(w)]).length;return `<div class="bar"><span style="width:${n*5}%"></span></div><p class="muted">${n} av 20 ord tränade den här helgen</p>`}function nav(){return `<nav class="nav"><button class="btn secondary" data-go="home">Hem</button><button class="btn secondary" data-go="lesson">Lektion</button><button class="btn secondary" data-go="cards">Flashcards</button><button class="btn secondary" data-go="quiz">Bild/ordquiz</button><button class="btn secondary" data-go="write">Skrivtest</button><button class="btn secondary" data-go="oral">Muntligt</button><button class="btn secondary" data-go="sentences">Meningar</button><button class="btn secondary" data-go="results">Framsteg</button></nav>`}function mark(w,correct){saved.seen[current+'-'+key(w)]=true;if(correct)saved.correct[current+'-'+key(w)]=(saved.correct[current+'-'+key(w)]||0)+1;persist()}function go(m){mode=m;idx=0;score=0;feedback='';answered=false;if(m==='quiz'){quiz=words().map((w,i)=>i).sort(()=>Math.random()-.5)}render()}function render(){let h=nav();let u=DATA[current];if(mode==='home'){h+=`<h1>Silav, William!</h1><p>Välj en helg och börja lära dig kurmanji.</p><div class="grid">${DATA.map((v,i)=>`<div class="card"><h2>Helg ${i+1}</h2><p>${safe(v.title)}</p><p class="muted">${v.words.filter(w=>saved.seen[i+'-'+key(w)]).length} / 20 ord tränade</p><button class="btn" data-unit="${i}">Öppna helgen</button></div>`).join('')}</div>`}else if(mode==='results'){let seen=Object.keys(saved.seen).length;h+=`<h1>Mina framsteg</h1><div class="card"><div class="big">${seen} / 200</div><p>Ordplatser tränade · ${saved.stars||0} stjärnor</p><p class="muted">Framstegen sparas i den här webbläsaren.</p><button class="btn secondary" id="export">Exportera säkerhetskopia</button> <label class="btn secondary" for="import">Importera säkerhetskopia</label><input id="import" type="file" accept="application/json" hidden></div><div class="grid">${DATA.map((v,i)=>`<div class="card"><b>Helg ${i+1}: ${safe(v.title)}</b><p>${v.words.filter(w=>saved.seen[i+'-'+key(w)]).length}/20 tränade</p><p>Skrivtest: ${saved.tests[i]??'Ej gjort'}</p><p>Muntligt: ${saved.oral[i]??'Ej gjort'}</p></div>`).join('')}</div>`}else{h+=`<h1>Helg ${current+1} – ${safe(u.title)}</h1>${progress()}`;if(mode==='lesson'){h+=`<div class="card"><h2>Alla 20 ord</h2>${words().map((w,i)=>`<div class="wordrow">${imageFor(w)?`<img class="artsmall" src="${imageFor(w)}" alt="${safe(w.sv)}">`:`<div class="artsmall placeholder" style="height:92px">Bild kommer</div>`}<div><strong>${safe(w.ku)}</strong><p>${safe(w.sv)}</p></div><button class="btn secondary" data-practice="${i}">Öva</button></div>`).join('')}</div>`}if(['cards','quiz','write','oral'].includes(mode)){let position=mode==='quiz'?quiz[idx]:idx;let w=words()[position];if(!w){h+=`<div class="card"><h2>Klart!</h2><p>Du har gått igenom alla 20 ord.</p><p>Resultat: ${score} rätt av 20.</p><button class="btn" data-go="lesson">Till lektionen</button></div>`}else{h+=`<div class="card"><p class="muted">${idx+1} av 20</p>${art(w)}`;if(mode==='cards'){h+=`<div class="q">${safe(w.ku)}</div><p>${answered?safe(w.sv):'Försök komma ihåg betydelsen.'}</p><div class="actions">${!answered?'<button class="btn" id="reveal">Visa betydelse</button>':`<button class="btn good" data-card="yes">Jag kunde det</button><button class="btn secondary" data-card="no">Behöver öva</button>`}</div>`}else if(mode==='quiz'){let choices=[w,...words().filter(x=>x.ku!==w.ku).sort(()=>Math.random()-.5).slice(0,3)].sort((a,b)=>a.ku.localeCompare(b.ku));if(!answers[idx])answers[idx]=choices.map(x=>x.ku);h+=`<p class="q">Vilket kurmanji-ord betyder ”${safe(w.sv)}”?</p><div class="grid">${answers[idx].map(x=>`<button class="choice" data-choice="${safe(x)}" ${answered?'disabled':''}>${safe(x)}</button>`).join('')}</div>`}else if(mode==='write'){h+=`<p class="q">Skriv ”${safe(w.sv)}” på kurmanji</p><input class="answer" id="typed" autocomplete="off" placeholder="Skriv ordet här" ${answered?'disabled':''}><div class="actions"><button class="btn" id="check" ${answered?'disabled':''}>Kontrollera</button></div>`}else{h+=`<p class="q">Säg ”${safe(w.sv)}” på kurmanji.</p><p class="muted">En förälder lyssnar och bedömer svaret.</p><div class="actions"><button class="btn good" data-oral="yes">Rätt</button><button class="btn secondary" data-oral="no">Behöver öva</button></div>`}if(feedback)h+=`<div class="status ${feedback.startsWith('Försök')?'badstatus':''}">${safe(feedback)}</div>`;if(answered&&mode!=='cards')h+=`<button class="btn" id="next">Nästa ord</button>`;h+='</div>'}}if(mode==='sentences'){h+=`<div class="card"><h2>Träna meningar</h2>${u.sentences.map((s,i)=>`<div class="line"><p><b>${safe(s.ku)}</b></p><p>${safe(s.sv)}</p><button class="btn secondary" data-sentence="${i}">Jag har tränat meningen</button></div>`).join('')}</div>`}}app.innerHTML=h}function next(){idx++;answered=false;feedback='';if(idx===20){if(mode==='write')saved.tests[current]=score+'/20';if(mode==='oral')saved.oral[current]=score+'/20';saved.stars+=score;persist()}render()}document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.unit!==undefined){current=+t.dataset.unit;go('lesson')}else if(t.dataset.go){go(t.dataset.go)}else if(t.dataset.practice!==undefined){idx=+t.dataset.practice;mode='cards';answered=false;render()}else if(t.id==='reveal'){answered=true;render()}else if(t.dataset.card){mark(words()[idx],t.dataset.card==='yes');next()}else if(t.dataset.choice){let w=words()[quiz[idx]];let ok=t.dataset.choice===w.ku;mark(w,ok);score+=+ok;feedback=ok?'Rätt! '+w.ku+' betyder '+w.sv:'Försök igen nästa gång. Rätt svar: '+w.ku;answered=true;render()}else if(t.id==='check'){let w=words()[idx],value=document.getElementById('typed').value.trim().toLocaleLowerCase();let ok=value===w.ku.toLocaleLowerCase();mark(w,ok);score+=+ok;feedback=ok?'Rätt!':'Försök igen nästa gång. Rätt svar: '+w.ku;answered=true;render()}else if(t.dataset.oral){let ok=t.dataset.oral==='yes';mark(words()[idx],ok);score+=+ok;next()}else if(t.id==='next'){next()}else if(t.dataset.sentence!==undefined){t.textContent='Tränad!'}else if(t.id==='export'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(saved,null,2)],{type:'application/json'}));a.download='william-framsteg.json';a.click();URL.revokeObjectURL(a.href)}});document.addEventListener('change',async e=>{if(e.target.id==='import'){try{let v=JSON.parse(await e.target.files[0].text());if(v&&typeof v==='object'&&v.seen&&v.correct){saved=v;persist();render()}else alert('Ogiltig säkerhetskopia')}catch{alert('Kunde inte läsa filen')}}});render();</script></body></html>
